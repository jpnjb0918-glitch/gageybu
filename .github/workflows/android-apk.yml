# 안드로이드판 APK 를 GitHub 에서 만들어 서명한다.
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions → Repository secrets):
#   ANDROID_KEYSTORE_BASE64   : gagyebu-release.jks 를 base64 로 바꾼 한 줄
#   ANDROID_KEYSTORE_PASSWORD : keystore-password.txt 의 첫 줄
# 언제 도나:
#   - main 에 gagyebu-android/ 변경이 올라올 때 → Actions 화면의 Artifacts 에 APK
#   - android-v<버전> 릴리스를 Publish 할 때 → 그 릴리스에 APK·가이드를 붙임
#   - Actions 화면의 Run workflow → 태그를 넣으면 그 릴리스에 다시 붙임, 비우면 빌드만
#     (build_ref 에 main 을 넣으면 태그의 커밋 대신 main 을 빌드해서 붙임 — 판 번호는 같고 고친 것만 반영할 때)
# 릴리스 첨부 파일은 이 작업이 관리한다 (붙이기 전에 그 릴리스의 기존 첨부를 지움).
# GitHub 은 첨부 파일 이름의 한글을 바꿔 버리므로 파일 이름은 영문, 화면 표시 이름(label)은 한글로 붙인다.
name: 안드로이드 APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '이미 있는 릴리스에 다시 붙일 태그 (예: android-v1.0.0). 비우면 빌드만'
        required: false
        default: ''
      build_ref:
        description: '빌드할 브랜치·커밋 (비우면 태그의 커밋). 판 번호는 그대로 두고 고친 것만 다시 붙일 때 main'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'gagyebu-android/**'
      - '.github/workflows/android-apk.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    # linux-v... 릴리스에는 돌지 않음
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'android-v')
    runs-on: ubuntu-24.04
    env:
      # 1.0.0 APK 서명 인증서의 SHA-256 (공개값). 다른 키로 서명되면 휴대폰에 덮어 설치가 안 되므로 실패시킨다.
      EXPECTED_CERT_SHA256: 872f5656ad00593f6d589b46c2f0b6dbc237067263b7589a6e7d9c2020ef964b
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build_ref || inputs.tag || '' }}

      - name: 릴리스 태그와 앱 버전이 같은지
        if: env.TAG != ''
        run: |
          VER="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' gagyebu-android/app/AndroidManifest.xml)"
          if [ "$TAG" != "android-v$VER" ]; then
            echo "::error::릴리스 태그 $TAG 와 AndroidManifest.xml 의 versionName $VER 이 다릅니다"
            exit 1
          fi

      - name: 도구 설치 (우분투 패키지, 로컬 빌드와 같은 것)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q android-sdk-platform-23 aapt apksigner zipalign dalvik-exchange openjdk-21-jdk-headless
          echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: 서명 키 꺼내기 (시크릿)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "::error::시크릿 ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD 를 먼저 넣어 주세요. (없으면 새 키로 서명되어 업데이트가 안 되므로 멈춥니다)"
            exit 1
          fi
          mkdir -p gagyebu-android/packaging
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > gagyebu-android/packaging/gagyebu-release.jks
          PW="$(printf '%s' "$KS_PW" | tr -d '\r\n')"
          printf '%s\n' "$PW" > gagyebu-android/packaging/keystore-password.txt
          export PW
          if ! keytool -list -keystore gagyebu-android/packaging/gagyebu-release.jks -storepass:env PW -alias gagyebu >/dev/null; then
            echo "::error::서명 키가 열리지 않습니다. 두 시크릿 값이 맞는지 확인해 주세요."
            exit 1
          fi

      - name: APK 만들기
        run: bash gagyebu-android/build-apk.sh

      - name: 휴대폰에 깔린 앱과 같은 키로 서명됐는지
        run: |
          APK="$(ls gagyebu-android/dist/*.apk)"
          cp "$APK" "$RUNNER_TEMP/check.apk"
          GOT="$(apksigner verify --print-certs "$RUNNER_TEMP/check.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)"
          echo "서명 인증서 SHA-256: $GOT"
          if [ "$GOT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::다른 키로 서명되었습니다 (기대값 $EXPECTED_CERT_SHA256)"
            exit 1
          fi

      - name: 서명 키 지우기
        if: always()
        run: rm -rf gagyebu-android/packaging

      - name: APK 보관 (Actions 화면의 Artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: gagyebu-android-apk
          path: gagyebu-android/dist/*.apk
          if-no-files-found: error

      - name: 릴리스에 APK·가이드 붙이기
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' gagyebu-android/app/AndroidManifest.xml)"
          cp gagyebu-android/dist/*.apk "$RUNNER_TEMP/gagyebu-android-$VER.apk"
          cp "gagyebu-android/안드로이드_설치·사용가이드.md" "$RUNNER_TEMP/gagyebu-android-guide-$VER.md"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while IFS= read -r n; do
            [ -n "$n" ] && gh release delete-asset -y -R "$GITHUB_REPOSITORY" -- "$TAG" "$n"
          done
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/gagyebu-android-$VER.apk#안드로이드판 $VER (APK)" \
            "$RUNNER_TEMP/gagyebu-android-guide-$VER.md#안드로이드 설치·사용 가이드"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[] | "\(.name)  \(.size)"'
